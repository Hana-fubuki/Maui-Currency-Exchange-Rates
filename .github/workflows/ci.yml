name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  build-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Build and test
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      WINDOWS_TFM: net10.0-windows10.0.19041.0
      WINDOWS_RID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore Windows target
        run: dotnet restore .\CurrencyExchangeRates\CurrencyExchangeRates.csproj -r ${{ env.WINDOWS_RID }} -p:TargetFramework=${{ env.WINDOWS_TFM }}

      - name: Restore tests
        run: dotnet restore .\CurrencyExchangeRates.Tests\CurrencyExchangeRates.Tests.csproj

      - name: Build Windows target
        run: dotnet build .\CurrencyExchangeRates\CurrencyExchangeRates.csproj -c Release -f ${{ env.WINDOWS_TFM }} -r ${{ env.WINDOWS_RID }} --no-restore

      - name: Run tests with coverage
        run: dotnet test .\CurrencyExchangeRates.Tests\CurrencyExchangeRates.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --settings .\CurrencyExchangeRates.Tests\coverage.runsettings

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: CurrencyExchangeRates.Tests\TestResults\**\test-results.trx

      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-results
          path: CurrencyExchangeRates.Tests\TestResults\**\coverage.cobertura.xml

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  codeql:
    if: github.event_name != 'branch_protection_rule'
    name: CodeQL analysis
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      WINDOWS_TFM: net10.0-windows10.0.19041.0
      WINDOWS_RID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore Windows target
        run: dotnet restore .\CurrencyExchangeRates\CurrencyExchangeRates.csproj -r ${{ env.WINDOWS_RID }} -p:TargetFramework=${{ env.WINDOWS_TFM }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  scorecards:
    if: github.event_name == 'branch_protection_rule' || github.event_name == 'schedule' || github.event_name == 'push'
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@v6
        with:
          name: scorecard-results
          path: results.sarif
